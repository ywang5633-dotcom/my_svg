<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鹈鹕骑自行车</title>
  <style>
    :root {
      color-scheme: dark;
      --sky: #102238;
      --ground: #162d2b;
      --cream: #fff4d6;
      --orange: #ff9b42;
      --teal: #52d1c4;
      --blue: #5aa9e6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(circle at 50% 0%, #254567 0, var(--sky) 58%, #09131f 100%);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .scene {
      width: min(100vw, 1100px);
      aspect-ratio: 16 / 9;
      min-height: 460px;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      box-shadow: 0 30px 80px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.12);
      background: linear-gradient(#1c3958 0 66%, var(--ground) 66%);
    }

    .title {
      position: absolute;
      z-index: 3;
      top: 22px;
      left: 28px;
      color: var(--cream);
      letter-spacing: .12em;
      font-size: clamp(13px, 1.5vw, 18px);
      font-weight: 700;
      text-transform: uppercase;
      opacity: .86;
    }

    .moon {
      position: absolute;
      top: 38px;
      right: 7%;
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: #ffe8a8;
      box-shadow: 0 0 38px rgba(255,232,168,.32);
    }

    .cloud { position: absolute; opacity: .18; fill: #d4efff; }
    .cloud.a { top: 22%; left: -3%; width: 28%; animation: drift 18s linear infinite; }
    .cloud.b { top: 36%; right: -4%; width: 25%; animation: drift 23s linear infinite reverse; }

    .road {
      position: absolute;
      left: -5%;
      bottom: 12%;
      width: 110%;
      height: 7px;
      border-radius: 99px;
      background: #567d78;
      box-shadow: 0 10px 0 rgba(0,0,0,.12);
    }

    .road::after {
      content: "";
      position: absolute;
      inset: 2px 0;
      background: repeating-linear-gradient(90deg, transparent 0 65px, rgba(255,240,178,.78) 65px 105px);
      animation: road 1.1s linear infinite;
    }

    .water {
      position: absolute;
      inset: auto 0 0;
      height: 13%;
      background: repeating-linear-gradient(0deg, transparent 0 15px, rgba(80,200,192,.18) 15px 17px);
      opacity: .9;
    }

    svg { position: absolute; inset: 0; width: 100%; height: 100%; }

    .bike { transform-origin: 50% 82%; animation: bob 1.1s ease-in-out infinite; }
    .wheel { fill: none; stroke: #e9f4f0; stroke-width: 6; }
    .spokes { fill: none; stroke: rgba(233,244,240,.58); stroke-width: 2; transform-origin: center; animation: spin .7s linear infinite; }
    .frame { fill: none; stroke: var(--orange); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    .handle, .seat { fill: none; stroke: var(--orange); stroke-width: 7; stroke-linecap: round; }
    .pelican { transform-origin: 50% 60%; animation: rider 1.1s ease-in-out infinite; }
    .leg { fill: none; stroke: #ffc06b; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; animation: pedal 1.1s ease-in-out infinite; transform-origin: 50% 50%; }
    .wing { transform-origin: 52% 56%; animation: flap 1.6s ease-in-out infinite; }

    .caption {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      color: rgba(255,244,214,.75);
      font-size: clamp(12px, 1.3vw, 15px);
      white-space: nowrap;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes rider { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(2deg); } }
    @keyframes pedal { 0% { transform: rotate(0deg); } 50% { transform: rotate(180deg); } 100% { transform: rotate(360deg); } }
    @keyframes flap { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-7deg) translateY(-3px); } }
    @keyframes road { to { transform: translateX(-105px); } }
    @keyframes drift { from { transform: translateX(-5%); } to { transform: translateX(15%); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="一只鹈鹕正在骑自行车的动画">
    <div class="title">Pelican on wheels</div>
    <div class="moon" aria-hidden="true"></div>

    <svg class="cloud a" viewBox="0 0 260 70" aria-hidden="true">
      <path d="M16 52c-15-22 20-38 41-20 10-28 56-31 67 1 30-14 65 12 48 32H28C17 65 8 60 16 52Z"/>
    </svg>
    <svg class="cloud b" viewBox="0 0 260 70" aria-hidden="true">
      <path d="M16 52c-15-22 20-38 41-20 10-28 56-31 67 1 30-14 65 12 48 32H28C17 65 8 60 16 52Z"/>
    </svg>

    <div class="road" aria-hidden="true"></div>
    <div class="water" aria-hidden="true"></div>

    <svg viewBox="0 0 1000 560" role="img" aria-labelledby="sceneTitle sceneDesc">
      <title id="sceneTitle">鹈鹕骑自行车</title>
      <desc id="sceneDesc">一只戴着小帽子的鹈鹕踩着橙色自行车，在夜色海边前进。</desc>
      <g class="bike">
        <g transform="translate(305 395)">
          <circle class="wheel" r="72"/>
          <g class="spokes">
            <path d="M0-66V66M-66 0H66M-47-47L47 47M47-47L-47 47"/>
          </g>
        </g>
        <g transform="translate(665 395)">
          <circle class="wheel" r="72"/>
          <g class="spokes">
            <path d="M0-66V66M-66 0H66M-47-47L47 47M47-47L-47 47"/>
          </g>
        </g>
        <path class="frame" d="M305 395 420 270 520 395 305 395 665 395 555 250 420 270"/>
        <path class="handle" d="M555 250h50l-16-34m16 34 28-13"/>
        <path class="seat" d="M397 247h55"/>
        <circle cx="520" cy="395" r="14" fill="#ff9b42"/>
        <path class="frame" d="M520 395 558 432m-38-37-40-36"/>
      </g>

      <g class="pelican">
        <path d="M451 174c17-36 49-54 87-44 33 9 49 43 32 72-13 21-44 31-77 22-23-6-40-24-42-50Z" fill="#f4f0df"/>
        <ellipse cx="520" cy="171" rx="57" ry="64" fill="#f4f0df"/>
        <path class="wing" d="M477 187c-35 25-38 70-12 92 25 22 63 11 70-25 5-24-15-59-58-67Z" fill="#d7decf"/>
        <path d="M536 130c28-26 62-22 76 3 11 19 0 42-21 49-17 6-36-6-39-23-3-13-8-21-16-29Z" fill="#f4f0df"/>
        <path d="M571 153c40 4 87 20 105 36-28 19-81 20-108 4Z" fill="#f5a64e"/>
        <path d="M585 158c27 7 57 16 75 28-28 4-59 2-80-6Z" fill="#ffd078" opacity=".7"/>
        <circle cx="558" cy="125" r="6" fill="#172330"/>
        <path d="M512 107c16-22 50-24 70-3l-11 8c-19-11-37-10-52 4Z" fill="#ff9b42"/>
        <path d="M481 292c-15 31-19 59-8 78" fill="none" stroke="#ffc06b" stroke-width="12" stroke-linecap="round"/>
        <path class="leg" d="M523 294c-3 30 9 53 35 69"/>
        <path d="M468 370h31m35-8h31" fill="none" stroke="#ffc06b" stroke-width="8" stroke-linecap="round"/>
        <path d="M494 194c-6 12-6 27 1 36" fill="none" stroke="#b3c4b8" stroke-width="5" stroke-linecap="round" opacity=".7"/>
      </g>
    </svg>

    <div class="caption">夜风正好，出发去看海。</div>
  </main>
</body>
</html>
