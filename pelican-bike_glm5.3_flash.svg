<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>鹈鹕骑自行车</title>
  <desc>一只戴蓝色围巾的鹈鹕骑着红色自行车：车轮旋转、双腿踩踏板、身体颠簸、喉囊晃动、围巾飘扬，云朵飘过、路面流动。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd9f6"/>
      <stop offset="1" stop-color="#eaf8ff"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#ffe98a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe98a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roadG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7680"/>
      <stop offset="1" stop-color="#525c66"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- 太阳（光芒缓慢旋转） -->
  <circle cx="96" cy="86" r="80" fill="url(#sunGlow)"/>
  <g stroke="#ffd93b" stroke-width="5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 96 86" to="360 96 86" dur="60s" repeatCount="indefinite"/>
    <line x1="96" y1="18" x2="96" y2="34"/>
    <line x1="96" y1="138" x2="96" y2="154"/>
    <line x1="28" y1="86" x2="44" y2="86"/>
    <line x1="148" y1="86" x2="164" y2="86"/>
    <line x1="49" y1="39" x2="60" y2="50"/>
    <line x1="132" y1="122" x2="143" y2="133"/>
    <line x1="143" y1="39" x2="132" y2="50"/>
    <line x1="60" y1="122" x2="49" y2="133"/>
  </g>
  <circle cx="96" cy="86" r="34" fill="#ffd93b"/>

  <!-- 云朵（无缝循环向左飘） -->
  <g fill="#ffffff" opacity="0.92">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="45s" repeatCount="indefinite"/>
    <ellipse cx="87" cy="96" rx="33" ry="15"/>
    <ellipse cx="120" cy="85" rx="37" ry="19"/>
    <ellipse cx="151" cy="96" rx="29" ry="14"/>
    <ellipse cx="406" cy="67" rx="24" ry="11"/>
    <ellipse cx="430" cy="59" rx="27" ry="14"/>
    <ellipse cx="452" cy="67" rx="21" ry="10"/>
    <ellipse cx="669" cy="121" rx="21" ry="10"/>
    <ellipse cx="690" cy="114" rx="24" ry="12"/>
    <ellipse cx="710" cy="121" rx="18" ry="9"/>
    <ellipse cx="887" cy="96" rx="33" ry="15"/>
    <ellipse cx="920" cy="85" rx="37" ry="19"/>
    <ellipse cx="951" cy="96" rx="29" ry="14"/>
    <ellipse cx="1206" cy="67" rx="24" ry="11"/>
    <ellipse cx="1230" cy="59" rx="27" ry="14"/>
    <ellipse cx="1252" cy="67" rx="21" ry="10"/>
    <ellipse cx="1469" cy="121" rx="21" ry="10"/>
    <ellipse cx="1490" cy="114" rx="24" ry="12"/>
    <ellipse cx="1510" cy="121" rx="18" ry="9"/>
  </g>

  <!-- 远山 -->
  <ellipse cx="180" cy="480" rx="320" ry="100" fill="#c7e6ac"/>
  <ellipse cx="620" cy="492" rx="380" ry="118" fill="#b5dd9b"/>

  <!-- 公路（虚线向左流动模拟前进） -->
  <rect x="0" y="460" width="800" height="40" fill="url(#roadG)"/>
  <line x1="0" y1="460" x2="800" y2="460" stroke="#3f4750" stroke-width="3"/>
  <line x1="0" y1="482" x2="800" y2="482" stroke="#f2e394" stroke-width="5" stroke-dasharray="45 35">
    <animate attributeName="stroke-dashoffset" from="0" to="80" dur="0.5s" repeatCount="indefinite"/>
  </line>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <line x1="150" y1="240" x2="205" y2="240" opacity="0">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-70 0" dur="0.55s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="0.55s" begin="0s" repeatCount="indefinite"/>
    </line>
    <line x1="120" y1="300" x2="185" y2="300" opacity="0">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-70 0" dur="0.55s" begin="0.18s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="0.55s" begin="0.18s" repeatCount="indefinite"/>
    </line>
    <line x1="160" y1="355" x2="215" y2="355" opacity="0">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-70 0" dur="0.55s" begin="0.36s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="0.55s" begin="0.36s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="405" cy="463" rx="180" ry="9" fill="#2d3439" opacity="0.18"/>

  <!-- 后轮 -->
  <g>
    <circle cx="280" cy="400" r="60" fill="none" stroke="#2d3439" stroke-width="9"/>
    <circle cx="280" cy="400" r="50" fill="none" stroke="#aab4bd" stroke-width="3"/>
    <g stroke="#c3ccd4" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0 280 400" to="360 280 400" dur="0.6s" repeatCount="indefinite"/>
      <line x1="280" y1="350" x2="280" y2="450"/>
      <line x1="230" y1="400" x2="330" y2="400"/>
      <line x1="245" y1="365" x2="315" y2="435"/>
      <line x1="245" y1="435" x2="315" y2="365"/>
    </g>
    <circle cx="280" cy="400" r="7" fill="#3a3f45"/>
  </g>

  <!-- 前轮 -->
  <g>
    <circle cx="540" cy="400" r="60" fill="none" stroke="#2d3439" stroke-width="9"/>
    <circle cx="540" cy="400" r="50" fill="none" stroke="#aab4bd" stroke-width="3"/>
    <g stroke="#c3ccd4" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0 540 400" to="360 540 400" dur="0.6s" repeatCount="indefinite"/>
      <line x1="540" y1="350" x2="540" y2="450"/>
      <line x1="490" y1="400" x2="590" y2="400"/>
      <line x1="505" y1="365" x2="575" y2="435"/>
      <line x1="505" y1="435" x2="575" y2="365"/>
    </g>
    <circle cx="540" cy="400" r="7" fill="#3a3f45"/>
  </g>

  <!-- 传动链条 -->
  <line x1="280" y1="393" x2="395" y2="391" stroke="#4a5158" stroke-width="2.5"/>
  <line x1="280" y1="407" x2="395" y2="419" stroke="#4a5158" stroke-width="2.5"/>
  <circle cx="280" cy="400" r="7" fill="none" stroke="#4a5158" stroke-width="2.5"/>
  <circle cx="395" cy="405" r="14" fill="none" stroke="#4a5158" stroke-width="3"/>

  <!-- 远侧曲柄与踏板（车身后面） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 395 405" to="360 395 405" dur="0.9s" repeatCount="indefinite"/>
    <line x1="395" y1="405" x2="370" y2="405" stroke="#8d99a3" stroke-width="5" stroke-linecap="round"/>
    <circle cx="370" cy="405" r="5.5" fill="#2d3439"/>
  </g>

  <!-- 远侧腿（相位相反） -->
  <polyline points="360,262 393,332 370,405" fill="none" stroke="#cf7d16" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="points" dur="0.9s" repeatCount="indefinite"
      values="360,262 393,332 370,405;360,262 396,321 377,387;360,262 404,313 395,380;360,262 412,314 413,387;360,262 416,323 420,405;360,262 413,334 413,423;360,262 405,340 395,430;360,262 396,340 377,423;360,262 393,332 370,405"/>
  </polyline>
  <circle cx="370" cy="405" r="5" fill="#cf7d16">
    <animate attributeName="cx" values="370;377;395;413;420;413;395;377;370" dur="0.9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="405;387;380;387;405;423;430;423;405" dur="0.9s" repeatCount="indefinite"/>
  </circle>

  <!-- 车架 -->
  <g stroke="#d63031" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M 395 405 L 352 292"/>
    <path d="M 352 292 L 512 298"/>
    <path d="M 395 405 L 522 338"/>
    <path d="M 512 298 L 522 338"/>
    <path d="M 522 338 L 540 400"/>
    <path d="M 395 405 L 280 400"/>
    <path d="M 280 400 L 352 292"/>
  </g>
  <line x1="352" y1="292" x2="347" y2="268" stroke="#3a3f45" stroke-width="5"/>
  <ellipse cx="350" cy="264" rx="26" ry="7" fill="#3a3f45"/>
  <g stroke="#3a3f45" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M 512 298 L 524 283"/>
    <path d="M 524 283 Q 536 281 542 290"/>
  </g>

  <!-- 鹈鹕（身体轻微颠簸） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 2.5;0 0" keyTimes="0;0.5;1"
      calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="0.9s" repeatCount="indefinite"/>

    <!-- 尾羽 -->
    <path d="M 320 196 Q 288 180 292 206 Q 296 230 322 240 Z" fill="#fdfdfd" stroke="#dfe5e9" stroke-width="2"/>

    <!-- 身体 -->
    <ellipse cx="372" cy="225" rx="58" ry="45" fill="#fdfdfd" stroke="#dfe5e9" stroke-width="2"/>

    <!-- 围巾飘带（身体上方向后飘） -->
    <path d="M 400 176 Q 370 186 342 176 Q 366 196 400 188 Z" fill="#3498db">
      <animate attributeName="d" dur="0.5s" repeatCount="indefinite"
        values="M 400 176 Q 370 186 342 176 Q 366 196 400 188 Z;M 400 176 Q 370 192 340 184 Q 368 202 400 188 Z;M 400 176 Q 370 186 342 176 Q 366 196 400 188 Z"/>
    </path>

    <!-- 翅膀搭在车把上 -->
    <path d="M 388 206 Q 470 230 546 288 L 532 296 Q 465 274 428 260 Q 398 248 392 236 Z"
      fill="#f2f5f7" stroke="#dfe5e9" stroke-width="2"/>
    <path d="M 500 268 Q 516 278 534 290" fill="none" stroke="#dfe5e9" stroke-width="2"/>

    <!-- 脖子 -->
    <path d="M 402 208 Q 408 162 452 150" fill="none" stroke="#dfe5e9" stroke-width="25" stroke-linecap="round"/>
    <path d="M 402 208 Q 408 162 452 150" fill="none" stroke="#fdfdfd" stroke-width="22" stroke-linecap="round"/>

    <!-- 头 -->
    <circle cx="458" cy="145" r="22" fill="#fdfdfd" stroke="#dfe5e9" stroke-width="2"/>
    <path d="M 446 127 Q 430 122 421 127 Q 433 112 449 119 Z" fill="#fdfdfd" stroke="#dfe5e9" stroke-width="1.5"/>

    <!-- 喉囊（随踩踏晃动） -->
    <path d="M 472 156 Q 482 214 526 211 Q 566 199 581 176 Q 526 160 472 156 Z" fill="#f7b955" stroke="#e09a2b" stroke-width="1.5">
      <animate attributeName="d" dur="0.9s" repeatCount="indefinite"
        values="M 472 156 Q 482 214 526 211 Q 566 199 581 176 Q 526 160 472 156 Z;M 472 156 Q 484 222 528 216 Q 567 202 581 176 Q 526 160 472 156 Z;M 472 156 Q 482 214 526 211 Q 566 199 581 176 Q 526 160 472 156 Z"/>
    </path>

    <!-- 长嘴 -->
    <path d="M 464 134 Q 550 146 590 168 L 586 176 Q 538 156 464 150 Z" fill="#f5a623" stroke="#d98a00" stroke-width="1"/>
    <line x1="478" y1="143" x2="505" y2="148" stroke="#d98a00" stroke-width="1.5"/>

    <!-- 围巾圈 -->
    <ellipse cx="411" cy="181" rx="14" ry="6.5" transform="rotate(30 411 181)" fill="#3498db"/>

    <!-- 眼睛 -->
    <circle cx="466" cy="138" r="3.5" fill="#2d3439"/>
    <circle cx="467.5" cy="136.5" r="1.2" fill="#ffffff"/>
  </g>

  <!-- 近侧曲柄与踏板（车身前面） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 395 405" to="360 395 405" dur="0.9s" repeatCount="indefinite"/>
    <line x1="395" y1="405" x2="420" y2="405" stroke="#3a3f45" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="420" cy="405" r="6" fill="#2d3439"/>
  </g>

  <!-- 近侧腿（跟随踏板转动） -->
  <polyline points="368,268 420,327 420,405" fill="none" stroke="#f0932b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="points" dur="0.9s" repeatCount="indefinite"
      values="368,268 420,327 420,405;368,268 417,338 413,423;368,268 409,344 395,430;368,268 400,344 377,423;368,268 397,336 370,405;368,268 400,325 377,387;368,268 409,317 395,380;368,268 417,318 413,387;368,268 420,327 420,405"/>
  </polyline>
  <circle cx="420" cy="405" r="5.5" fill="#f0932b">
    <animate attributeName="cx" values="420;413;395;377;370;377;395;413;420" dur="0.9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="405;423;430;423;405;387;380;387;405" dur="0.9s" repeatCount="indefinite"/>
  </circle>
</svg>
